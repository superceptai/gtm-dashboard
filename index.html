<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Supercept GTM Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#0B0BD6;
    --primary-06:rgba(11,11,214,0.06);
    --primary-12:rgba(11,11,214,0.12);
    --secondary:#914BF9;
    --secondary-10:rgba(145,75,249,0.10);
    --accent:#19F991;
    --accent-darker:#19A674;
    --accent-darker-10:rgba(25,166,116,0.10);
    --showcase-green:#12A050;
    --ebony:#1E232C;
    --ebony-70:#6A6E74;
    --ebony-65:#737780;
    --ebony-50:#8F9299;
    --mercury:#E8E8E8;
    --surface-light:#F7F7FA;
    --white:#FFFFFF;
    --border:rgba(30,35,44,0.10);
    --border-strong:rgba(30,35,44,0.18);
    --success-bg:rgba(25,166,116,0.10);
    --success-text:#0F6E56;
    --danger-bg:rgba(217,71,71,0.10);
    --danger-text:#A32D2D;
    --warn-bg:rgba(186,117,23,0.10);
    --warn-text:#854F0B;
    --info-bg:rgba(11,11,214,0.06);
    --info-text:#0C447C;
    --r-sm:6px;
    --r-md:10px;
    --r-lg:12px;
    --r-xl:16px;
    --shadow-resting:0 2px 6px rgba(15,23,42,0.04), 0 16px 40px -16px rgba(15,23,42,0.08);
    --max:1280px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--white);
    color:var(--ebony);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:400;
    font-size:14px;
    line-height:1.5;
    letter-spacing:0;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
  @media (max-width:640px){.wrap{padding:0 16px}}
  header.masthead{padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:32px}
  .masthead-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .brand .mark{font-weight:600;font-size:22px;line-height:1;letter-spacing:-0.01em;color:var(--ebony)}
  .brand .divider{height:16px;width:1px;background:var(--border-strong);align-self:center}
  .brand .label{text-transform:uppercase;letter-spacing:0.18em;font-size:11px;font-weight:600;color:var(--primary)}
  .masthead-meta{font-size:12px;color:var(--ebony-70);margin-top:4px}

  .source-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .src-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:500;color:var(--ebony);background:var(--surface-light);border:1px solid var(--border);line-height:1.4}
  .src-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-darker);flex-shrink:0}
  .src-badge.fresh{color:var(--success-text);background:var(--success-bg);border-color:rgba(25,166,116,0.20)}
  .src-badge.fresh .dot{background:var(--accent-darker)}
  .src-badge.cached{color:var(--info-text);background:var(--info-bg);border-color:rgba(11,11,214,0.18)}
  .src-badge.cached .dot{background:var(--info-text)}
  .src-badge.stale{color:var(--warn-text);background:var(--warn-bg);border-color:rgba(186,117,23,0.20)}
  .src-badge.stale .dot{background:var(--warn-text)}
  .src-badge.failed{color:var(--danger-text);background:var(--danger-bg);border-color:rgba(217,71,71,0.20)}
  .src-badge.failed .dot{background:var(--danger-text)}
  .src-badge.fallback{color:var(--ebony-70);background:var(--surface-light);border-color:var(--border)}
  .src-badge.fallback .dot{background:var(--ebony-50)}
  .src-badge .st{opacity:0.75;text-transform:uppercase;letter-spacing:0.08em;font-size:10px;margin-left:2px}
  .freshness{text-align:right;color:var(--ebony-70);font-size:13px;line-height:1.45}
  .freshness .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-darker);margin-right:6px;vertical-align:middle}
  .freshness.stale .dot{background:#F2DC13}
  .freshness.error .dot{background:var(--danger-text)}
  .freshness small{display:block;font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:0.18em;font-weight:600}
  .sl{font-size:13px;font-weight:600;color:var(--ebony);margin:0 0 4px;letter-spacing:0}
  .sr{font-size:11.5px;color:var(--ebony-70);margin:0 0 14px;line-height:1.5}
  .mc{background:var(--surface-light);border-radius:var(--r-md);padding:14px 16px}
  .mc.featured{background:var(--white);border:1px solid var(--border-strong)}
  .mc .lbl{margin:0 0 4px;font-size:11.5px;color:var(--ebony-70);font-weight:500}
  .mc .val{margin:0;font-size:24px;font-weight:500;line-height:1;letter-spacing:-0.01em;color:var(--ebony);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .mc .val.success{color:var(--accent-darker)}
  .mc .val.muted{color:var(--ebony-50)}
  .mc .val.info{color:var(--primary)}
  .mc .sub{margin:4px 0 0;font-size:11px;color:var(--ebony-70);line-height:1.4}
  .mc .conn{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ebony-70);display:flex;justify-content:space-between;align-items:baseline}
  .mc .conn b{color:var(--ebony);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
  .mc-ph{background:var(--surface-light);border-radius:var(--r-md);padding:14px 16px;opacity:0.6}
  .mc-ph .lbl{margin:0 0 4px;font-size:11.5px;color:var(--ebony-70);font-weight:500}
  .mc-ph .val{margin:0;font-size:24px;font-weight:500;color:var(--ebony-50);font-variant-numeric:tabular-nums;line-height:1}
  .mc-ph .sub{margin:4px 0 0;font-size:11px;color:var(--ebony-70)}
  .mc-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  .mc-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  @media (max-width:520px){.mc-grid-2{grid-template-columns:1fr}}
  .panel{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-resting)}
  .panel-title{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ebony)}
  .panel-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:11.5px;color:var(--ebony-70)}
  .panel-legend span{display:flex;align-items:center;gap:6px}
  .panel-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .div{height:1px;background:var(--border);margin:32px 0}
  .seq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:20px}
  .sc{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-resting)}
  .sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
  .sc-head .name{margin:0;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ebony)}
  .sc-head .meta{margin:4px 0 0;font-size:11px;color:var(--ebony-70);font-variant-numeric:tabular-nums}
  .sc-section-label{margin:10px 0 6px;font-size:10px;color:var(--ebony-70);text-transform:uppercase;letter-spacing:0.06em;font-weight:500}
  .sc-section-label:first-of-type{margin-top:0}
  .sc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
  .sc-stats-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
  .sc-stats-2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:6px}
  .sc-total{display:flex;justify-content:flex-end;font-size:11px;color:var(--ebony-70);padding:6px 2px 0;border-top:1px solid var(--border);margin-top:6px}
  .sc-total b{color:var(--ebony);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
  .sc-footnote{margin-top:12px;padding:10px 12px;background:var(--info-bg);border-left:3px solid var(--primary);border-radius:0 var(--r-sm) var(--r-sm) 0}
  .sc-footnote p{margin:0 0 6px;font-size:11px;line-height:1.5;color:var(--info-text)}
  .sc-footnote p:last-child{margin-bottom:0}
  .sc-footnote b{font-weight:500;color:var(--info-text)}
  .ss{background:var(--surface-light);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
  .ss .l{margin:0 0 2px;font-size:10.5px;color:var(--ebony-70);font-weight:500}
  .ss .v{margin:0;font-size:16px;font-weight:500;line-height:1.1;color:var(--ebony);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .ss .v.success{color:var(--accent-darker)}
  .ss .v.danger{color:var(--danger-text)}
  .ss .v.info{color:var(--primary)}
  .ss .v.muted{color:var(--ebony-50)}
  .ss .v.warn{color:var(--warn-text)}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;line-height:1.4;flex-shrink:0;text-transform:lowercase;letter-spacing:0}
  .pill.active{background:var(--success-bg);color:var(--success-text)}
  .pill.paused{background:var(--surface-light);color:var(--ebony-70)}
  .pill.danger{background:var(--danger-bg);color:var(--danger-text)}
  .pill.warn{background:var(--warn-bg);color:var(--warn-text)}
  .pill.success{background:var(--success-bg);color:var(--success-text)}
  .pill.info{background:var(--info-bg);color:var(--info-text)}
  #funnel{padding:6px 0}
  .funnel-row{display:flex;flex-direction:column;align-items:center;margin-bottom:2px}
  .funnel-drop{font-size:11.5px;color:var(--ebony-70);padding:5px 0;text-align:center}
  .funnel-drop b{color:var(--ebony);font-weight:500}
  .funnel-bar{border-radius:var(--r-sm);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-sizing:border-box;color:var(--white)}
  .funnel-bar .left p:first-child{margin:0;font-size:12.5px;font-weight:500;color:var(--white)}
  .funnel-bar .left p:last-child{margin:2px 0 0;font-size:11px;color:rgba(255,255,255,0.78)}
  .funnel-bar .right{text-align:right;flex-shrink:0;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .pipeline-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:10px}
  .pstage{background:var(--white);padding:14px 12px;text-align:center}
  .pstage .lbl{margin:0 0 4px;font-size:11px;color:var(--ebony-70);font-weight:500}
  .pstage .val{margin:0;font-size:24px;font-weight:500;line-height:1;letter-spacing:-0.01em;color:var(--ebony);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .pstage .val.muted{color:var(--ebony-50)}
  .note{font-size:11.5px;color:var(--ebony-70);background:var(--surface-light);border-radius:var(--r-md);padding:10px 12px;margin-top:10px;line-height:1.5}
  .note.setup{display:flex;align-items:flex-start;gap:8px}
  .note .icon{flex-shrink:0;margin-top:1px;color:var(--primary)}
  .note .icon svg{width:14px;height:14px;display:block;stroke:currentColor;stroke-width:1.75;fill:none}
  footer{margin-top:80px;padding:32px 0 40px;border-top:1px solid var(--border);color:var(--ebony-70);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  footer a{color:var(--primary);text-decoration:none;font-weight:500}
  footer a:hover{text-decoration:underline}
  footer code{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--ebony);background:var(--surface-light);padding:2px 8px;border-radius:var(--r-sm)}
  .loading{padding:80px 0;text-align:center;color:var(--ebony-70);font-size:13px}
  .error-banner{padding:16px 20px;background:var(--danger-bg);border:1px solid rgba(163,45,45,0.30);border-radius:var(--r-md);color:var(--danger-text);font-size:13px;margin:20px 0;line-height:1.5}
  .error-banner strong{display:block;margin-bottom:4px;font-weight:600}
  .error-banner code{font-family:"IBM Plex Sans",sans-serif;background:rgba(255,255,255,0.5);padding:1px 6px;border-radius:4px;font-size:12px}

  /* --- refresh pipeline additions: source health, NO DATA, tracks, trends --- */
  .src-badge.error,.src-badge.failed{color:var(--danger-text);background:var(--danger-bg);border-color:rgba(217,71,71,0.20)}
  .src-badge.error .dot,.src-badge.failed .dot{background:var(--danger-text)}
  .src-badge .ls{opacity:0.7;font-size:10px;margin-left:4px;letter-spacing:0;text-transform:none}
  .nodata{display:flex;align-items:center;gap:8px;padding:14px 16px;background:var(--danger-bg);border:1px dashed rgba(163,45,45,0.40);border-radius:var(--r-md);color:var(--danger-text);font-size:12.5px;font-weight:500;margin-bottom:14px}
  .nodata b{font-weight:600}
  .nodata .tag{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;background:var(--danger-text);color:var(--white);padding:2px 8px;border-radius:999px}
  .track-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.track-wrap{grid-template-columns:1fr}}
  .track{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-resting)}
  .track h4{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--ebony)}
  .track .track-sub{margin:0 0 12px;font-size:11px;color:var(--ebony-70);line-height:1.45}
  .tstep{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .tstep:last-of-type{border-bottom:none}
  .tstep .tl{font-size:12px;color:var(--ebony)}
  .tstep .tl small{display:block;font-size:10.5px;color:var(--ebony-70)}
  .tstep .tv{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ebony);text-align:right;white-space:nowrap}
  .tstep .tv small{font-size:11px;color:var(--ebony-70);font-weight:400;margin-left:6px}
  .tstep .tv.muted{color:var(--ebony-50)}
  .track-target{margin-top:12px;padding:8px 10px;background:var(--info-bg);border-left:3px solid var(--primary);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:11px;color:var(--info-text);line-height:1.5}
  .track-target b{font-weight:600}
  .wow{font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:500}
  .wow.up{color:var(--accent-darker)}
  .wow.down{color:var(--danger-text)}
  .wow.flat{color:var(--ebony-70)}
  .conv-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;font-size:11.5px;color:var(--ebony-70)}
  .conv-row .cv{background:var(--surface-light);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .conv-row .cv b{color:var(--ebony);font-weight:600}
</style>
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="masthead-row">
      <div>
        <div class="brand">
          <span class="mark">Supercept</span>
          <span class="divider"></span>
          <span class="label">GTM Dashboard</span>
        </div>
        <div class="masthead-meta" id="masthead-meta">Loading...</div>
        <div class="source-status" id="source-status"></div>
      </div>
      <div class="freshness" id="freshness">
        <div><span class="dot"></span><span id="as-of">Loading...</span></div>
        <small id="freshness-label">Loading</small>
      </div>
    </div>
  </header>

  <div id="app">
    <div class="loading">Loading dashboard data...</div>
  </div>

  <footer>
    <div>Source: <code>data.json</code> &middot; refreshed daily via Cowork pipeline plus on-demand</div>
    <div><a href="https://www.notion.so/36e406423d7181e69e88e5d0d718f4a3">PRD</a> &middot; <a href="https://www.notion.so/36e406423d718113b3f6c9d33c8d9488">Metrics spec</a> &middot; <a href="https://www.notion.so/36f406423d7181d9921ae21b75a9f1a5">Iteration log</a></div>
  </footer>

</div>

<script>
const SCHEMA_VERSION_EXPECTED = 1;

// Planning assumption: Reply.io per-sequence safety setting.
// The dashboard uses this for the Rate cell and runway calculation, overriding the 7-day actual
// (stored in data.json as s.rate_per_day and s.runway_days). The 7-day actual is artificially low
// while sequences ramp to steady state, so the dashboard runway view uses the per-sequence ceiling
// instead to produce a deliberately conservative planning floor. See the Reply.io Sequence Health
// Feed change log (31 May 2026) for context.
const ASSUMED_SEND_RATE_PER_DAY = 35;

// Runway is days until the send queue is exhausted. Numerator is s.new (queued for send,
// CSV Active+Step2). v1.1 incorrectly used s.pending (in-wait, CSV Active+Step255) which
// measured the wrong cohort. Fixed in v1.2 (31 May 2026).
const assumedRunway = (s) => {
  if (typeof s.new === 'number' && s.new >= 0) {
    return s.new / ASSUMED_SEND_RATE_PER_DAY;
  }
  return null;
};

const fmt = (n) => {
  if (n === null || n === undefined) return '\u2014';
  if (typeof n === 'number') return n.toLocaleString('en-AU');
  return String(n);
};
const fmtPct = (n) => {
  if (n === null || n === undefined) return '\u2014';
  if (typeof n === 'number') return n.toFixed(1) + '%';
  return String(n);
};
const fmtDays = (n) => {
  if (n === null || n === undefined) return '\u2014';
  if (typeof n !== 'number') return String(n);
  return '~' + n.toFixed(1) + 'd';
};
const fmtRate = (n) => {
  if (n === null || n === undefined) return '\u2014';
  if (typeof n !== 'number') return String(n);
  return n.toFixed(1) + '/d';
};
const fmtFollowerDelta = (li) => {
  // Prefer longest window with data: 30d > 7d > 24h. Returns "+N last 30d", "-3 last 7d", etc.
  // Falls back to "last 30d —" while the followers feed is still bootstrapping its history.
  if (!li) return 'last 30d \u2014';
  const candidates = [
    { v: li.followers_30d_delta, label: 'last 30d' },
    { v: li.followers_7d_delta,  label: 'last 7d'  },
    { v: li.followers_24h_delta, label: 'last 24h' }
  ];
  for (const c of candidates) {
    if (typeof c.v === 'number') {
      return (c.v > 0 ? '+' : '') + fmt(c.v) + ' ' + c.label;
    }
  }
  return 'last 30d \u2014';
};
const escapeHtml = (s) => {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
};

function runwayPill(days, status) {
  if (status === 'paused') return { cls: 'paused', text: 'paused' };
  if (days === null || days === undefined) return { cls: 'paused', text: '\u2014' };
  if (days < 3) return { cls: 'danger', text: fmtDays(days) + ' \u26A0' };
  if (days < 7) return { cls: 'warn', text: fmtDays(days) + ' \u26A0' };
  return { cls: 'success', text: fmtDays(days) };
}

function runwayValClass(days, status) {
  if (status === 'paused') return 'muted';
  if (days === null || days === undefined) return 'muted';
  if (days < 3) return 'danger';
  if (days < 7) return 'warn';
  return 'success';
}

function showError(title, detail) {
  document.getElementById('as-of').textContent = 'Data load failed';
  document.getElementById('freshness-label').textContent = 'Error';
  document.getElementById('freshness').classList.add('error');
  document.getElementById('masthead-meta').textContent = 'Live data could not be loaded';
  document.getElementById('app').innerHTML = `
    <div class="error-banner">
      <strong>${escapeHtml(title)}</strong>
      ${escapeHtml(detail)}<br>
      The Cowork refresh pipeline writes <code>data.json</code> nightly at 23:00 AEST.
      If this persists, check the latest commit on
      <a href="https://github.com/superceptai/gtm-dashboard/commits/main" style="color:inherit;text-decoration:underline">GitHub</a>
      or open the <a href="https://www.notion.so/36f406423d7181d9921ae21b75a9f1a5" style="color:inherit;text-decoration:underline">iteration log</a>.
    </div>

async function loadData() {
  let data;
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) {
      showError('Could not load data.json', `HTTP ${res.status} ${res.statusText}.`);
      return;
    }
    data = await res.json();
  } catch (e) {
    showError('Could not load data.json', `Fetch or parse failed: ${e.message}.`);
    return;
  }

  if (data.schema_version !== undefined && data.schema_version !== SCHEMA_VERSION_EXPECTED) {
    console.warn(
      `schema_version mismatch: renderer expects ${SCHEMA_VERSION_EXPECTED}, data.json has ${data.schema_version}. ` +
      `Rendering may be incomplete or incorrect.`
    );
  }

  // history.jsonl powers the week-over-week trend views. It is optional: if it
  // cannot be loaded the dashboard still renders, just without the trend lines.
  const history = await loadHistory();

  try {
    render(data, history);
  } catch (e) {
    console.error('Render failed:', e);
    showError('Dashboard render failed', `${e.message}. The data file loaded successfully but the renderer hit an error.`);
  }
}

// Parse history.jsonl (one JSON object per line) into an array of snapshots,
// oldest first. Each row is { snapshot_timestamp, schema_version, data }.
async function loadHistory() {
  try {
    const res = await fetch('history.jsonl?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return [];
    const text = await res.text();
    const rows = [];
    for (const line of text.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      try { rows.push(JSON.parse(t)); } catch (e) { /* skip a bad line */ }
    }
    rows.sort((a, b) => String(a.snapshot_timestamp).localeCompare(String(b.snapshot_timestamp)));
    return rows;
  } catch (e) {
    console.warn('history.jsonl not loaded:', e.message);
    return [];
  }
}

// Pull a numeric series out of history via an accessor, returning the most
// recent `limit` points as { label, value }. `label` is the short as_of label.
function histSeries(history, accessor, limit) {
  const pts = [];
  for (const row of (history || [])) {
    const d = row && row.data;
    if (!d) continue;
    let v;
    try { v = accessor(d); } catch (e) { v = undefined; }
    if (typeof v !== 'number' || isNaN(v)) continue;
    const label = d.as_of_label || String(row.snapshot_timestamp || '').slice(0, 10);
    pts.push({ label, value: v });
  }
  return limit ? pts.slice(-limit) : pts;
}

// Week-over-week delta: compares the latest value to the value ~7 days earlier
// in history. Returns { html } for a coloured up/down/flat chip, or '' if we
// lack a comparison point.
function wowChip(history, accessor, opts) {
  opts = opts || {};
  const series = histSeries(history, accessor);
  if (series.length < 2) return '';
  const latest = series[series.length - 1].value;
  // find a point roughly a week back (at least 1 step back)
  let prevIdx = series.length - 2;
  const targetTs = Date.now() - 7 * 864e5;
  for (let i = series.length - 2; i >= 0; i--) {
    const ts = Date.parse((history[i] && history[i].snapshot_timestamp) || '');
    if (!isNaN(ts) && ts <= targetTs) { prevIdx = i; break; }
  }
  const prev = series[prevIdx].value;
  const diff = latest - prev;
  const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
  const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '–');
  const sign = diff > 0 ? '+' : '';
  const val = opts.pct ? (sign + diff.toFixed(1) + ' pts') : (sign + fmt(diff));
  return `<span class="wow ${cls}">${arrow} ${val} <span style="opacity:.7">WoW</span></span>`;
}


function getSourceStatus(d) {
  // Prefer structured source_status; fall back to parsing feed_label
  const structured = d.source_status;
  if (structured) {
    const mk = (key, label) => ({
      key, label,
      status: structured[key]?.status || 'fresh',
      last_success: structured[key]?.last_success || null
    });
    return [
      mk('hubspot_icp', 'HubSpot ICP'),
      mk('reply_io', 'Reply.io'),
      mk('ga4', 'GA4'),
      mk('linkedin', 'LinkedIn')
    ];
  }
  const label = (d.feed_label || '').toUpperCase();
  function detect(cases, defaultStatus) {
    for (const [needle, status] of cases) {
      if (label.includes(needle)) return status;
    }
    return defaultStatus;
  }
  return [
    { key: 'hubspot_icp', label: 'HubSpot ICP',
      status: detect([['HS_ICP_UNAVAILABLE','failed'],['HS_ICP_STALE','stale'],['HS_ICP_CACHED','cached']], 'fresh') },
    { key: 'reply_io',    label: 'Reply.io',
      status: detect([['REPLY_UNAVAILABLE','failed'],['REPLY_STALE','stale'],['REPLY_CACHED','cached']], 'fresh') },
    { key: 'ga4',         label: 'GA4',
      status: detect([['GA4_UNAVAILABLE','failed'],['GA4_STALE','stale'],['GA4_CACHED','cached']], 'fresh') },
    { key: 'linkedin',    label: 'LinkedIn',
      status: (d.linkedin && d.linkedin.status === 'stale_fallback') ? 'fallback'
              : detect([['LINKEDIN_UNAVAILABLE','failed'],['LINKEDIN_STALE','stale'],['LINKEDIN_CACHED','cached']], 'fresh') }
  ];
}

// Short "last success" label, e.g. "2h ago" / "3d ago", from an ISO timestamp.
function fmtAgo(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (isNaN(t)) return '';
  const mins = Math.max(0, Math.round((Date.now() - t) / 6e4));
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

// A leg is "down" when its source_status is error or failed. Its section must
// render NO DATA instead of showing carried-forward numbers as if current.
function legDown(d, key) {
  const s = d.source_status && d.source_status[key] && d.source_status[key].status;
  return s === 'error' || s === 'failed';
}

function renderSourceStatus(d) {
  const el = document.getElementById('source-status');
  if (!el) return;
  const sources = getSourceStatus(d);
  el.innerHTML = sources.map(s => {
    const down = s.status === 'error' || s.status === 'failed';
    const stText = down ? 'NO DATA' : s.status;
    const ago = s.last_success ? `<span class="ls">${escapeHtml(fmtAgo(s.last_success))}</span>` : '';
    return `<span class="src-badge ${s.status}" title="${escapeHtml(s.last_success ? 'Last success: ' + s.last_success : 'No successful pull recorded')}">` +
      `<span class="dot"></span><span>${escapeHtml(s.label)}</span>` +
      `<span class="st">${escapeHtml(stText)}</span>${ago}</span>`;
  }).join('');
}

// Reusable NO DATA panel for a section whose source leg is down.
function noDataPanel(label) {
  return `<div class="nodata"><span class="tag">No data</span>` +
    `<span><b>${escapeHtml(label)}</b> source is currently unavailable. ` +
    `Showing nothing rather than stale numbers — check the source health strip above.</span></div>`;
}

      <div class="mc"><p class="lbl">Disqualified</p><p class="val">${fmt(d.ga4.disqualified)}</p><p class="sub">application_disqualified</p></div>
      <div class="mc"><p class="lbl">Intake calls booked</p><p class="val">${fmt(d.ga4.intake)}</p><p class="sub">intake_call_booked \u00B7 CVR ${fmtPct(d.ga4.intake_cvr)}</p></div>
      <div class="mc"><p class="lbl">Purchases</p><p class="val">${fmt(d.ga4.purchase)}</p><p class="sub">purchase \u00B7 CVR ${fmtPct(d.ga4.purchase_cvr)}</p></div>
    </div>
    ${ga4DailyPanel}
    `}

    <div class="div"></div>

    <p class="sl">LinkedIn \u2014 Aaron's profile ${legDown(d, 'linkedin') ? '' : wowChip(history, x => x.linkedin.followers_current)}</p>
    <p class="sr">Personal profile analytics${d.linkedin && d.linkedin.source ? ' \u00B7 source: ' + escapeHtml(d.linkedin.source === 'manual_override' ? 'manual override' : d.linkedin.source) : ''}</p>
    ${legDown(d, 'linkedin') ? noDataPanel('LinkedIn \u2014 Aaron\'s profile') : `
    <div class="mc-grid-4">
      <div class="mc"><p class="lbl">Followers</p><p class="val">${fmt(d.linkedin.followers_current)}</p><p class="sub">${fmtFollowerDelta(d.linkedin)}</p></div>
      <div class="${d.linkedin.impressions === null || d.linkedin.impressions === undefined ? 'mc-ph' : 'mc'}"><p class="lbl">Impressions</p><p class="val">${fmt(d.linkedin.impressions)}</p><p class="sub">this week</p></div>
      <div class="${d.linkedin.engagement === null || d.linkedin.engagement === undefined ? 'mc-ph' : 'mc'}"><p class="lbl">Engagement rate</p><p class="val">${fmtPct(d.linkedin.engagement)}</p><p class="sub">interactions / impressions</p></div>
      <div class="${d.linkedin.profile_views === null || d.linkedin.profile_views === undefined ? 'mc-ph' : 'mc'}"><p class="lbl">Profile views</p><p class="val">${fmt(d.linkedin.profile_views)}</p><p class="sub">this week</p></div>
    </div>
    `}

  `;

  setTimeout(() => {
    const ctx = document.getElementById('bandChart');
    if (ctx && window.Chart) {
      new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
          labels: d.bands.labels,
          datasets: [
            { label: 'HubSpot ANZ', data: d.bands.hubspot, backgroundColor: '#0B0BD6', borderRadius: 3, borderSkipped: false },
            { label: 'Non-HubSpot ANZ', data: d.bands.non_hubspot, backgroundColor: '#914BF9', borderRadius: 3, borderSkipped: false }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + c.raw.toLocaleString() } }
          },
          scales: {
            x: { grid: { color: 'rgba(30,35,44,0.06)' }, ticks: { color: '#6A6E74', font: { size: 11, family: 'IBM Plex Sans' }, autoSkip: false, maxRotation: 30 } },
            y: { grid: { color: 'rgba(30,35,44,0.06)' }, ticks: { color: '#6A6E74', font: { size: 11, family: 'IBM Plex Sans' }, callback: (v) => v.toLocaleString() } }
          }
        }
      });
    }

    const ga4Ctx = document.getElementById('ga4DailyChart');
    if (ga4Ctx && window.Chart && Array.isArray(d.ga4.daily) && d.ga4.daily.length > 0) {
      new Chart(ga4Ctx.getContext('2d'), {
        type: 'line',
        data: {
          labels: d.ga4.daily.map(p => p.date),
          datasets: [{
            label: 'Sessions',
            data: d.ga4.daily.map(p => p.sessions),
            borderColor: '#0B0BD6',
            backgroundColor: 'rgba(11,11,214,0.10)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#0B0BD6'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6A6E74', font: { size: 11 } } },
            y: { beginAtZero: true, grid: { color: 'rgba(30,35,44,0.06)' }, ticks: { color: '#6A6E74', font: { size: 11 }, precision: 0 } }
          }
        }
      });
    }

    // ICP coverage week-over-week (from history.jsonl). Two y-axes because the
    // total-ICP series is an order of magnitude larger than the 1st-degree ones.
    const covCtx = document.getElementById('coverageChart');
    if (covCtx && window.Chart) {
      const ceoS = histSeries(history, x => x.icp.combined.ceo_1st, 12);
      const croS = histSeries(history, x => x.icp.combined.cro_1st, 12);
      const totS = histSeries(history, x => x.icp.combined.ceo_contacts + x.icp.combined.cro_contacts, 12);
      new Chart(covCtx.getContext('2d'), {
        type: 'line',
        data: {
          labels: ceoS.map(p => p.label),
          datasets: [
            { label: 'CEO 1st', data: ceoS.map(p => p.value), borderColor: '#0B0BD6', backgroundColor: 'rgba(11,11,214,0.08)', tension: 0.3, pointRadius: 2, fill: false, yAxisID: 'y' },
            { label: 'CRO 1st', data: croS.map(p => p.value), borderColor: '#914BF9', backgroundColor: 'rgba(145,75,249,0.08)', tension: 0.3, pointRadius: 2, fill: false, yAxisID: 'y' },
            { label: 'Total ICP', data: totS.map(p => p.value), borderColor: '#19A674', backgroundColor: 'rgba(25,166,116,0.06)', tension: 0.3, pointRadius: 2, fill: false, yAxisID: 'y1' }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + c.raw.toLocaleString() } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6A6E74', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
            y: { position: 'left', beginAtZero: true, grid: { color: 'rgba(30,35,44,0.06)' }, ticks: { color: '#6A6E74', font: { size: 10 } } },
            y1: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { color: '#19A674', font: { size: 10 } } }
          }
        }
      });
    }
  }, 0);

  // Funnel \u2014 two tracks (see brief). Track A is whole-ICP coverage and includes
  // pre-existing first-degree connections; Track B is outreach conversion and
  // counts only contacts actually sent outreach (Reply.io sequences). The split
  // between pre-existing and outreach-driven connections is computed as:
  //   outreach-driven = Reply.io invites accepted (funnel.track_a.outreach_connected)
  //   pre-existing     = total first-degree connected \u2212 outreach-driven
  // This is FLAGGED for reconciliation against the funnel spec.
  const tracks = document.getElementById('funnel-tracks');
  if (tracks) {
    const f = d.funnel || {};
    // Prefer the pipeline-produced track objects; if an older data.json is being
    // served (before the refresh pipeline first runs) derive them from the
    // existing ICP + sequence fields so the view still renders correctly.
    const sumSeq = (k) => (d.sequences || []).reduce((a, s) => a + (typeof s[k] === 'number' ? s[k] : 0), 0);
    const icpC = (d.icp && d.icp.combined) || {};
    const connectedFallback = (icpC.ceo_1st || 0) + (icpC.cro_1st || 0);
    const outreachFallback = sumSeq('connection_requests_accepted');
    const A = f.track_a || {
      icp_contacts: f.icp_contacts,
      connected: connectedFallback,
      connected_pct_of_icp: f.icp_contacts ? (connectedFallback / f.icp_contacts) * 100 : null,
      pre_existing_connected: Math.max(0, connectedFallback - outreachFallback),
      outreach_connected: outreachFallback
    };
    const B = f.track_b || {
      enrolled: sumSeq('total'),
      invited: sumSeq('connections_sent'),
      invited_pct_of_enrolled: sumSeq('total') ? (sumSeq('connections_sent') / sumSeq('total')) * 100 : null,
      connected_via_outreach: outreachFallback,
      connected_pct_of_invited: sumSeq('connections_sent') ? (outreachFallback / sumSeq('connections_sent')) * 100 : null,
      intake: 0,
      deal: 0
    };
    const tgt = f.targets || {};
    const stepRow = (label, sub, val, extra) =>
      `<div class="tstep"><div class="tl">${escapeHtml(label)}${sub ? `<small>${escapeHtml(sub)}</small>` : ''}</div>` +
      `<div class="tv">${val}${extra ? `<small>${escapeHtml(extra)}</small>` : ''}</div></div>`;

    const goalLine = (label, actual, target) =>
      (typeof target === 'number' && target > 0)
        ? `<div class="track-target">Goal: <b>${fmt(target)}</b> ${escapeHtml(label)} \u00B7 ${fmtPct((actual / target) * 100)} of target</div>`
        : '';

    const trackA = `<div class="track">
      <h4>Track A \u2014 ICP coverage</h4>
      <p class="track-sub">Whole ICP \u2192 first-degree connected. Includes pre-existing first-degree connections.</p>
      ${stepRow('ICP contacts', 'CEO + CRO, all ANZ ICP', fmt(A.icp_contacts))}
      ${stepRow('Connected (1st-degree)', 'incl. pre-existing', fmt(A.connected), fmtPct(A.connected_pct_of_icp) + ' of ICP')}
      ${stepRow('\u2014 of which pre-existing', 'connected before outreach', fmt(A.pre_existing_connected))}
      ${stepRow('\u2014 of which via outreach', 'accepted an outreach invite', fmt(A.outreach_connected))}
      ${goalLine('connected', A.connected, tgt.connected)}
    </div>`;

    const trackB = `<div class="track">
      <h4>Track B \u2014 outreach conversion</h4>
      <p class="track-sub">Only contacts actually sent outreach (contacts enrolled in a Reply.io sequence).</p>
      ${stepRow('Enrolled', 'in active sequences', fmt(B.enrolled))}
      ${stepRow('Invited', 'LinkedIn invites sent', fmt(B.invited), fmtPct(B.invited_pct_of_enrolled) + ' of enrolled')}
      ${stepRow('Connected via outreach', 'invites accepted', fmt(B.connected_via_outreach), fmtPct(B.connected_pct_of_invited) + ' of invited')}
      ${stepRow('Intake calls', 'booked (beta pipeline)', fmt(B.intake))}
      ${stepRow('Deals', 'accepted to beta', fmt(B.deal))}
      ${goalLine('intake calls', B.intake, tgt.intake)}
    </div>`;

    tracks.innerHTML = trackA + trackB;
  }
}

loadData();
</script>

</body>
</html>
